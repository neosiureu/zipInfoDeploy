// Experiment harness (build plan 4.1). Uses ai-core from this repository through includeBuild.
// Repositories: Maven Central by default. A workspace that cannot reach Maven Central
// passes -PaiDepsRepo=<folder m2 of the order-1 bundle> and builds with --offline.
dependencyResolutionManagement {
    repositories {
        def offline = providers.gradleProperty('aiDepsRepo')
        if (offline.present) {
            maven { url = new File(offline.get()).toURI() }
        } else {
            mavenCentral()
        }
    }
}

rootProject.name = 'harness'

includeBuild('../../zipinfo-project/ai-core')
