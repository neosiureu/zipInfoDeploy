plugins {
    id 'application'
}

group = 'com.zipinfo'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.zipinfo:ai-core:0.1.0'   // replaced by the included build ../../zipinfo-project/ai-core
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Same versions everywhere (gradle.lockfile) and same bytes (gradle/verification-metadata.xml).
dependencyLocking {
    lockAllConfigurations()
}

application {
    mainClass = 'com.zipinfo.harness.Main'
}

tasks.named('test') {
    useJUnitPlatform()
    // AnswersCrossCheckTest reads the replay store (767,597 trades) when experiment/prep/out exists.
    maxHeapSize = '2g'
    // The test reads ../prep/out, which Gradle does not track. Always run it so the cross-check line prints every time.
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}
